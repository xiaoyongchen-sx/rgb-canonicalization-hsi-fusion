diffusion:
  params:
    sf: 8
    schedule_name: exponential
    schedule_kwargs:
      power: 0.3
    etas_end: 0.999
    steps: 5
    min_noise_level: 0.001
    kappa: 2.0
    band_dim: 31
    normalize_input: False
    latent_flag: None

model:
  params:
    image_size: 512
    in_channels: 34
    model_channels: 34
    out_channels: 34
    channel_mult: [1,1,1,1,1]
    num_res_blocks: [1,1,1,1,1]
    dims: 2
    lqrgb_channels: 34
    norm_groups: 34

data:
  output_dir: 'output'
  dataset_name: 'ICVL'
  srf_path: 'SRF/P_N_V2.mat'
  train:
    params:
      dir_paths: ['dataset/ICVL/train']
      gt_size: 256
      crop_pos: [0, 0]
  val:
    params:
      dir_paths: ['dataset/ICVL/test']
      gt_size: 256
      crop_pos: [0, 0]

train:
  lr:  1e-4          # learning rate
  batch: [1,1]
  num_workers: 1
  microbatch: 1
  epochs: 3000
  test_frequency: 100
  resume: null
  pretrained: null
